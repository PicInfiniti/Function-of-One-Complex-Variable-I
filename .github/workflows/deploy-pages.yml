name: Deploy qualifying exam study guide to Pages

on:
  push:
    branches: [main]
    paths:
      - QUALIFYING_EXAM_STUDY_GUIDE.html
      - Conway_Functions_of_one_complex_variable.pdf
      - Exams/main.tex
      - Exercise/complex.tex
      - Qualifying Exam/main.tex
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p "_site/Exams" "_site/Exercise" "_site/Qualifying Exam"
          cp "QUALIFYING_EXAM_STUDY_GUIDE.html" "_site/index.html"
          cp "Conway_Functions_of_one_complex_variable.pdf" "_site/"
          cp "Exams/main.tex" "_site/Exams/"
          cp "Exercise/complex.tex" "_site/Exercise/"
          cp "Qualifying Exam/main.tex" "_site/Qualifying Exam/"
          touch "_site/.nojekyll"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
